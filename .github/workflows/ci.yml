name: Verify and build FrameLab
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: framelab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all --check
      - run: cargo test -p framelab-core --locked
      - run: cargo clippy -p framelab-core --all-targets --locked
  interface:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run format:check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: interface-evidence
          path: artifacts/browser
          retention-days: 7
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt
      - run: npm ci --ignore-scripts
      - run: npm run prepare:tools
      - run: npm run prepare:notices
      - run: npm run tauri -- build --ci
      - run: cargo build -p nexora-framelab --bin framelab-cli --release --locked
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts\native | Out-Null
          & .\target\release\framelab-cli.exe example | Set-Content artifacts\native\synthetic-example.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\target\release\framelab-cli.exe analyze fixtures\synthetic-baseline.csv | Set-Content artifacts\native\synthetic-analysis.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $comparison=& .\target\release\framelab-cli.exe compare fixtures\synthetic-baseline.csv fixtures\synthetic-candidate.csv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $comparison | Set-Content artifacts\native\synthetic-comparison.json -Encoding utf8
          $parsed=$comparison | ConvertFrom-Json
          if (-not $parsed.comparable -or $parsed.deltas.fpsPct -le 0) { throw 'Comparison CLI failed' }
          $blocked=& .\target\release\framelab-cli.exe compare fixtures\synthetic-baseline.csv fixtures\synthetic-baseline.csv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $parsed=$blocked | ConvertFrom-Json
          if ($parsed.comparable -or $null -ne $parsed.deltas) { throw 'Duplicate capture was not blocked' }
      - run: python scripts/package-source.py
      - run: .\scripts\package-windows.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-packages
          path: |
            artifacts/windows/*.zip
            artifacts/windows/*-setup.exe
            artifacts/windows/SHA256SUMS.txt
            artifacts/release/*
            artifacts/native/*
          retention-days: 7
