[workspace]
members = ["crates/framelab-core", "src-tauri"]
default-members = ["crates/framelab-core"]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.2"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
